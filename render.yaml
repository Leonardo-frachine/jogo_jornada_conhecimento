databases:
  - name: jornada-db
    databaseName: jornada_conhecimento
    region: virginia
    plan: basic-256mb
    ipAllowList: []

services:
  - type: web
    name: jornada-api
    runtime: node
    rootDir: jornada-api
    plan: starter
    region: virginia
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jornada-db
          property: connectionString
      - key: DB_SYNCHRONIZE
        value: "true"
      - key: DATABASE_SEED_SQL_PATH
        value: sql/perguntas_teste_25.sql
      - key: IA_ENABLED
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
